<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Épisodes de la formation BentoUL | BENTOUL CREATION</title>
    <meta name="description" content="Tous les épisodes de cette formation BentoUL : astuces Android, PC et informatique expliquées étape par étape en chapitres à lire en ligne.">
    <meta name="keywords" content="épisodes formation, astuces Android, astuces PC, informatique, tutoriel, BentoUL, BENTOUL CREATION">
    <meta name="robots" content="index, follow">
    <meta name="author" content="BENTOUL CREATION">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="BENTOUL CREATION">
    <meta property="og:title" content="Épisodes de la formation BentoUL">
    <meta property="og:description" content="Les épisodes de la formation, à lire gratuitement en ligne sur BENTOUL CREATION.">
    <meta name="twitter:card" content="summary">

    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

    <main class="main-content" data-app-content>
        <div class="page-head">
            <a class="back-link" href="/bentoul.html">Toutes les séries</a>
            <h1 id="series-title">Épisodes</h1>
            <p id="series-desc"></p>
        </div>

        <div id="episodes-grid" class="state-msg">Chargement des épisodes...</div>
    </main>

    <script src="/js/config.js"></script>
    <script src="/js/session.js"></script>
    <script src="/js/app.js"></script>

    <script>
        // bentoul.gs une fois déployé ; en attendant, reprise des données benamoura.
        const API_URL = window.BTM_CONFIG.BENTOUL_API_URL || window.BTM_CONFIG.BENAMOURA_API_URL;
        const FREE_EPISODES = 3;
        const unlockedEpisodes = new Set();

        async function btmApiGet(action, extra) {
            const query = new URLSearchParams(Object.assign({ action: action }, extra || {}));
            const res = await fetch(API_URL + "?" + query);
            if (!res.ok) throw new Error("Serveur indisponible.");
            return await res.json();
        }

        async function loadUnlocks() {
            const session = BTM.getSession();
            if (!session) return;
            try {
                const result = await BTM.api({ action: "getUnlocks", token: session.token });
                if (result.success && Array.isArray(result.episodes)) {
                    result.episodes.forEach(function (id) { unlockedEpisodes.add(String(id)); });
                }
            } catch (error) {
                // API déployée sans getUnlocks : tout semble verrouillé, déblocage proposé au clic
            }
        }

        async function unlockEpisode(episodeId, url, card) {
            const session = BTM.getSession();

            if (!session) {
                BTM.gotoLogin();
                return;
            }

            const credits = Number(session.user && session.user.credits) || 0;
            const cost = Number(card.getAttribute("data-cost")) || 1;
            if (!confirm("Débloquer cet épisode pour " + cost + " crédit(s) ? (il te reste " + credits + " crédit(s))")) {
                return;
            }

            const button = card.querySelector(".send-unlock") || card;
            button.setAttribute("disabled", "disabled");

            try {
                const result = await BTM.api({
                    action: "unlockEpisode",
                    token: session.token,
                    episodeId: episodeId
                });

                if (result.success) {
                    unlockedEpisodes.add(String(episodeId));
                    const fresh = await BTM.refreshUser();
                    if (fresh) BTM.updateAuthZones(fresh);
                    location.href = url;
                } else if (result.code === "SESSION_INVALID") {
                    BTM.clearSession();
                    BTM.gotoLogin();
                } else {
                    alert(result.message || "Déblocage impossible pour le moment.");
                    button.removeAttribute("disabled");
                }
            } catch (error) {
                alert("Déblocage impossible : " + error.message);
                button.removeAttribute("disabled");
            }
        }

        // Le backend bentoul.gs fournit numero/gratuit/verrouille/coutCredits ;
        // à défaut (ancienne API), on retombe sur la règle des 3 premiers épisodes gratuits.
        function episodeNumero(ep, index) {
            return Number(ep.numero) || (index + 1);
        }

        function isPaid(ep, index) {
            if (typeof ep.gratuit === "boolean") return !ep.gratuit;
            if (typeof ep.verrouille === "boolean") return ep.verrouille;
            return index >= FREE_EPISODES;
        }

        function isLocked(ep, index) {
            if (ep.achete === true || unlockedEpisodes.has(String(ep.id))) return false;
            return isPaid(ep, index);
        }

        function plainText(html, max) {
            const div = document.createElement("div");
            div.innerHTML = String(html || "");
            let text = (div.textContent || "").replace(/\s+/g, " ").trim();
            if (text.length > max) text = text.slice(0, max).trimEnd() + "...";
            return text;
        }

        async function init() {
            const seriesId = new URLSearchParams(location.search).get("s");

            if (!seriesId) {
                location.replace(window.BTM_CONFIG.BENTOUL_SERIES_PAGE);
                return;
            }

            const grid = document.getElementById("episodes-grid");

            try {
                const [seriesResult, episodesResult] = await Promise.all([
                    btmApiGet("getSeries"),
                    btmApiGet("getEpisodes", { seriesId: seriesId })
                ]);

                if (seriesResult.status !== "success" || episodesResult.status !== "success") {
                    throw new Error("Réponse invalide du serveur.");
                }

                const series = (seriesResult.data || []).find(function (s) {
                    return String(s.id) === String(seriesId);
                });

                if (series) {
                    document.getElementById("series-title").textContent = series.titre || "Épisodes";
                    document.title = (series.titre || "Épisodes") + " - épisodes de la formation | BENTOUL CREATION";
                    document.getElementById("series-desc").textContent = plainText(series.contenu, 200);
                    const descMeta = document.querySelector('meta[name="description"]');
                    if (descMeta) descMeta.setAttribute("content",
                        "Tous les épisodes de la formation BentoUL « " + (series.titre || "") + " » : " +
                        plainText(series.contenu, 140));
                }

                const episodes = (episodesResult.data || []).filter(function (ep) {
                    return String(ep.statut || "Publié") === "Publié";
                }).sort(function (a, b) {
                    return episodeNumero(a, 0) - episodeNumero(b, 0);
                });

                await loadUnlocks();

                if (!episodes.length) {
                    grid.className = "state-msg";
                    grid.textContent = "Aucun épisode publié pour cette série.";
                    return;
                }

                grid.className = "cards-grid";
                grid.innerHTML = episodes.map(function (ep, index) {
                    const url = window.BTM_CONFIG.BENTOUL_READER_PAGE
                        + "?e=" + encodeURIComponent(ep.id)
                        + "&s=" + encodeURIComponent(seriesId);
                    const img = ep.image
                        ? '<img class="card-img" src="' + BTM.escapeHtml(ep.image) + '" alt="" loading="lazy">'
                        : "";
                    const locked = isLocked(ep, index);
                    const cost = Number(ep.coutCredits) || 1;
                    const badge = locked
                        ? '<span class="lock-badge">' +
                          '<svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><path d="M12 17a2 2 0 0 0 2-2 2 2 0 0 0-2-2 2 2 0 0 0-2 2 2 2 0 0 0 2 2zm6-7h-1V7a5 5 0 0 0-10 0v3H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2zM8.9 7a3.1 3.1 0 0 1 6.2 0v3H8.9z"/></svg>' +
                          ' ' + cost + (cost > 1 ? " crédits" : " crédit") + '</span>'
                        : "";

                    return `
                        <a class="content-card${locked ? " locked" : ""}" data-id="${BTM.escapeHtml(String(ep.id))}" data-cost="${cost}" data-url="${BTM.escapeHtml(url)}" href="${BTM.escapeHtml(url)}">
                            ${img}
                            ${badge}
                            <div class="card-overlay">
                                <h3>${BTM.escapeHtml("Episode " + episodeNumero(ep, index) + " - " + (ep.titre || ""))}</h3>
                                <p>${BTM.escapeHtml(plainText(ep.contenu, 160))}</p>
                            </div>
                        </a>`;
                }).join("");

                grid.addEventListener("click", function (event) {
                    const card = event.target.closest(".content-card.locked");
                    if (!card) return;
                    event.preventDefault();
                    unlockEpisode(card.getAttribute("data-id"), card.getAttribute("data-url"), card);
                });

            } catch (error) {
                grid.className = "state-msg error";
                grid.textContent = "Impossible de charger les épisodes : " + error.message;
            }
        }

        init();
    </script>
</body>
</html>
